<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mdnote</title>
    <script>
      window.__MDNOTE_CONFIG__ = __MDNOTE_CONFIG_JSON__;
      const theme = window.__MDNOTE_CONFIG__.theme;
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      if (window.__MDNOTE_CONFIG__.lineNumbers) document.documentElement.classList.add("line-numbers");
    </script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
